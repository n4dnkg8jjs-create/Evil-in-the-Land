<!doctype html>
<html><head><meta charset="utf-8"><title>dev view</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="960" height="540"></canvas>
<script type="module">
// A bare page for looking at one thing (a flame, a model) without loading the whole game.
import * as THREE from 'three';
window.THREE = THREE;
const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
R.setSize(960, 540, false); R.toneMapping = THREE.ACESFilmicToneMapping; R.outputColorSpace = THREE.SRGBColorSpace;
window.R = R; window.devReady = true;
</script></body></html>
